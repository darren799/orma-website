<h2>Express Interest in Sponsorship</h2>

<form id="sponsorForm">
  <label for="org">Organization or Individual Name</label>
  <input id="org" name="organization" required>

  <label for="contact">Contact Name</label>
  <input id="contact" name="contact_name" required>

  <label for="email">Email Address</label>
  <input id="email" name="email" type="email" required>

  <label for="level">Sponsorship Level of Interest</label>
  <select id="level" name="level">
    <option>Community Sponsor</option>
    <option>Maritime Sponsor</option>
    <option>Steward Sponsor</option>
    <option>Founding Sponsor</option>
    <option>Request More Information</option>
  </select>

  <button type="submit">Submit Sponsorship Interest</button>

  <p id="sponsorStatus" role="status" aria-live="polite"></p>
</form>
